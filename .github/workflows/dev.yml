# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "feature-inicial" branch
  push:
    branches: [ "feature-inicial" ]
  pull_request:
    branches: [ "feature-inicial" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # 1. ANALISE DE NEGOCIO
  business_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Documentação de Negócio
        run: echo "Validando requisitos e critérios de aceite..."

  # 2. ESPECIFICACAO FUNCIONAL
  functional_spec:
    needs: business_analysis
    runs-on: ubuntu-latest
    steps:
      - name: Validar Protótipos e Mockups
        run: echo "Garantindo que a especificação técnica está pronta para o dev."

  # 3. DESENVOLVIMENTO (Build e Lint)
  development:
    needs: functional_spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        run: echo "Instalando dependências e compilando o código..."
      - name: Run Lint
        run: echo "Checando padrões de código."

  # 4. TESTE (Unitários, Integração, QA)
  testing:
    needs: development
    runs-on: ubuntu-latest
    steps:
      - name: Run Unit Tests
        run: echo "Executando testes automatizados..."
      - name: Security Scan
        run: echo "Verificando vulnerabilidades (SAST)..."

  # 5. DEPLOY
  deploy:
    needs: testing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: echo "Fazendo o deploy para o ambiente de produção."

  # 6. SUSTENTAÇÃO (Monitoramento e Health Check)
  maintenance:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: echo "Verificando se o sistema está online e estável..."
      - name: Notify Team
        run: echo "Enviando status para o time de SRE/Sustentação."
